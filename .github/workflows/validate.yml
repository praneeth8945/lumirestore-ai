name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-cpu.txt

      - name: Compile source files
        run: python -m compileall -q src run_demo.py app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
